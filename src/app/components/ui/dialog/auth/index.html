<div class="card-surface p-6 w-full max-w-sm mx-auto"
     (click)="$event.stopPropagation()">

    <div class="flex items-center gap-3 mb-5">
        <div class="w-8 h-8 rounded-full bg-phosphor/10 border border-phosphor/30
                    flex items-center justify-center">
            <svg class="w-4 h-4 text-phosphor" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>
        <div>
            <h3 class="font-display text-sm font-semibold text-bone">Authenticate</h3>
            <p class="font-mono text-[10px] text-steel">CMS access requires admin credentials</p>
        </div>
    </div>

    @if (error()) {
    <div class="mb-4 px-3 py-2 bg-red-500/10 border border-red-500/30 rounded
                font-mono text-xs text-red-400">
        {{ error() }}
    </div>
    }

    <div class="space-y-3">
        <div>
            <label class="block font-mono text-[10px] text-steel tracking-wider uppercase mb-1"
                   for="cms-email">Email</label>
            <input id="cms-email" type="email" class="input-field text-xs"
                   placeholder="admin&#64;miloseng.com"
                   [(ngModel)]="email"
                   (keydown.enter)="authenticate()" />
        </div>
        <div>
            <label class="block font-mono text-[10px] text-steel tracking-wider uppercase mb-1"
                   for="cms-pass">Password</label>
            <input id="cms-pass" type="password" class="input-field text-xs"
                   placeholder="••••••••"
                   [(ngModel)]="password"
                   (keydown.enter)="authenticate()" />
        </div>
    </div>

    <div class="flex gap-2 mt-5">
        <button class="btn-secondary flex-1 justify-center text-xs py-2"
                (click)="close(false)">Cancel</button>
        <button class="btn-primary flex-1 justify-center text-xs py-2"
                [disabled]="loading()"
                (click)="authenticate()">
            {{ loading() ? 'Verifying...' : 'Authenticate' }}
        </button>
    </div>
</div>
