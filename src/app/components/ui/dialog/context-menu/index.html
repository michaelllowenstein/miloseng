<div class="fixed z-[9999] min-w-[180px] py-1
             bg-[#0d1117] border border-[#94a3b8]/30
             rounded-lg shadow-2xl shadow-black/60" [style.left.px]="data.x" [style.top.px]="data.y">

  @for (item of data.items; track item.label) {
  <button class="w-full px-4 py-2.5 text-left font-mono text-xs text-[#cbd5e1]
                 hover:bg-[#33ff88]/10 hover:text-[#33ff88] transition-colors
                 flex items-center gap-2.5" (click)="close('edit')">
    <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
    </svg>
    <span>Edit: {{ item.label }}</span>
  </button>
  }
</div>
