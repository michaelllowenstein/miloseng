<div class="card-surface p-6 w-full max-w-lg mx-auto overflow-y-auto max-h-[80vh]"
     (click)="$event.stopPropagation()">

    <div class="flex items-center justify-between mb-5">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-phosphor/10 border border-phosphor/30
                        flex items-center justify-center">
                <svg class="w-4 h-4 text-phosphor" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
            </div>
            <div>
                <h3 class="font-display text-sm font-semibold text-bone">Edit: {{ data.label }}</h3>
                <p class="font-mono text-[10px] text-steel">{{ data.path }}</p>
            </div>
        </div>
        <button class="p-1 text-steel hover:text-phosphor transition-colors" (click)="close(false)">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    @if (loading()) {
    <div class="py-8 text-center font-mono text-xs text-steel">Loading content...</div>
    } @else {
    <div class="space-y-4">
        @for (field of fields(); track field.key) {
        <div>
            <label class="block font-mono text-[10px] text-steel tracking-wider uppercase mb-1">
                {{ field.key }}
            </label>
            @if (field.type === 'textarea') {
            <textarea class="input-field text-xs min-h-[120px] resize-y"
                      [(ngModel)]="field.value"></textarea>
            } @else {
            <input type="text" class="input-field text-xs" [(ngModel)]="field.value" />
            }
        </div>
        }
    </div>

    @if (error()) {
    <div class="mt-3 px-3 py-2 bg-red-500/10 border border-red-500/30 rounded
                font-mono text-xs text-red-400">
        {{ error() }}
    </div>
    }

    @if (saved()) {
    <div class="mt-3 px-3 py-2 bg-phosphor/10 border border-phosphor/30 rounded
                font-mono text-xs text-phosphor">
        Saved successfully
    </div>
    }

    <div class="flex gap-2 mt-5">
        <button class="btn-secondary flex-1 justify-center text-xs py-2"
                (click)="close(false)">Cancel</button>
        <button class="btn-primary flex-1 justify-center text-xs py-2"
                [disabled]="saving()"
                (click)="save()">
            {{ saving() ? 'Saving...' : 'Submit' }}
        </button>
    </div>
    }
</div>
