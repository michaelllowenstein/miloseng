@if (open) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-6">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-void/80 backdrop-blur-sm" (click)="close()"></div>

    <!-- Panel -->
    <div class="relative card-surface p-6 max-w-lg w-full animate-fade-up">
        <div class="flex items-center justify-between mb-4">
            <h3 class="font-display text-lg font-semibold text-bone">{{ title }}</h3>
            <button class="text-mist hover:text-phosphor transition-colors" (click)="close()">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <ng-content />
    </div>
</div>
}
