@if (message) {
<div class="fixed bottom-6 right-6 z-50 px-5 py-3 rounded-lg border backdrop-blur-xl
            font-mono text-xs shadow-lg animate-fade-up"
     [class]="type === 'success'
       ? 'bg-phosphor/10 border-phosphor/30 text-phosphor'
       : type === 'error'
         ? 'bg-red-500/10 border-red-500/30 text-red-400'
         : 'bg-signal/10 border-signal/30 text-signal'">
    {{ message }}
</div>
}
