<section class="pt-28 pb-16">
  <div class="section-container">
    <p
      cmsField="breadcrumb"
      cmsPath="about/header"
      class="font-mono text-xs text-steel tracking-widest uppercase mb-3 animate-fade-in">
      ~/about
    </p>

    <h1
      class="font-display text-3xl md:text-4xl lg:text-5xl font-bold text-bone
             leading-tight animate-fade-up"
      style="animation-delay: 0.1s; opacity: 0;">
      <span cmsField="headline" cmsPath="about/header">
        Engineering at the intersection of
      </span>
      <span> </span>
      <span
        cmsField="headlineAccent"
        cmsPath="about/header"
        class="text-gradient-phosphor">
        architecture and automation
      </span>
    </h1>
  </div>
</section>

<section class="pb-20">
  <div class="section-container">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
      <div class="lg:col-span-7">
        <h2
          appScrollAnimate="up"
          class="font-display text-xl font-semibold text-bone mb-5 flex items-center gap-3">
          <span class="w-8 h-px bg-phosphor/40"></span>
          About Me
        </h2>

        <div
          appScrollAnimate="up"
          [animateDelay]="0.1"
          appReadable
          class="text-sm space-y-4">
          @for (paragraph of bioParagraphs; track $index) {
            <p>{{ paragraph }}</p>
          }
        </div>

        <div appScrollAnimate="up" [animateDelay]="0.3" class="mt-8">
          <app-resume-button variant="primary" />
        </div>
      </div>

      <div class="lg:col-span-5">
        <div
          appScrollAnimate="up"
          [animateDelay]="0.2"
          class="card-surface p-6 space-y-5">
          <h3 class="font-mono text-xs text-steel tracking-widest uppercase">
            Quick Facts
          </h3>

          @for (fact of quickFacts; track fact.label) {
            <div class="flex items-start gap-3">
              <span class="w-1.5 h-1.5 mt-1.5 rounded-full bg-phosphor/40 shrink-0"></span>
              <div>
                <p class="font-mono text-[10px] text-steel uppercase tracking-wider">
                  {{ fact.label }}
                </p>
                <p class="text-sm text-bone">{{ fact.value }}</p>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>

<app-experience />
